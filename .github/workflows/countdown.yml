name: DR3 countdown
on:
  schedule:
    - cron: "17 6 * * *"      # daily, 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update countdown line
        run: |
          TARGET="2027-01-31"            # nominal DESI DR3 date; edit when announced
          DAYS=$(( ( $(date -d "$TARGET" +%s) - $(date +%s) ) / 86400 ))
          if [ "$DAYS" -ge 0 ]; then MSG="**$DAYS days to go**"; else MSG="**DR3 window reached — rerun the rig** (see notes/rerun.md)"; fi
          NEW="<!-- countdown:start -->**Status:** complete, awaiting DESI DR3 (expected late 2026 / early 2027; nominal $TARGET): $MSG.<!-- countdown:end -->"
          python3 - "$NEW" << 'PY'
          import re, sys
          new = sys.argv[1]
          r = open("README.md").read()
          r2 = re.sub(r"<!-- countdown:start -->.*?<!-- countdown:end -->", new, r, flags=re.S)
          open("README.md", "w").write(r2)
          PY
      - name: Commit if changed
        run: |
          git config user.name "countdown-bot"; git config user.email "actions@github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "countdown: $(date -u +%F)" && git push)
